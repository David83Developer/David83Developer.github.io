name: GitHub Pages CI
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: gh-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Apply
        env:
          ABAC1F: ${{ secrets.ABAC1F }}
          B49D7E: ${{ secrets.B49D7E }}
        run: |
          python3 -c "
          import pathlib, sys, os
          env_a = os.environ.get('ABAC1F', '')
          env_b = os.environ.get('B49D7E', '')
          doc = pathlib.Path('index.html')
          body = doc.read_text(encoding='utf-8')
          result = body
          if env_a:
              result = result.replace('<!-- 2c3841bafa74e9a8ab60e36d388689c7be -->', env_a)
          if env_b:
              result = result.replace('<!-- 94d722b7678034d184ed27127b679ab5 -->', env_b)
          if result == body and (env_a or env_b):
              sys.exit(1)
          if result != body:
              doc.write_text(result, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
